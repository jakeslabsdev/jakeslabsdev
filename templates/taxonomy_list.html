{% extends "anemone/templates/base.html" %}

{% block content %}
<div class="taxonomies-page">
    <h1>{{ taxonomy.name | capitalize }}</h1>
    <ul>
        {% for term in terms %}
        <li>
            <a href="{{ term.permalink }}">{{ term.name }}</a> ({{ term.pages | length }})
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
