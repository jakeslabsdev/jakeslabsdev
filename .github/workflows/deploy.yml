name: Build and deploy Zola website

on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Crucial: If the Anemone theme for shiosaiiLabs is a Git submodule, 
          # this ensures it actually gets pulled. Missing this is the #1 cause 
          # of Zola builds failing after the action itself succeeds.
          submodules: recursive 

      - name: Build Zola + upload Pages artifact
        uses: getzola/github-pages@master # <-- The fix: Use @master instead of @v2
        with:
          zola_version: v0.23.3 # Update this to match your local version
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
