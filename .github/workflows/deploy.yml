name: Deploy Zola to GitHub Pages

on:
  push:
    branches:
      - main 

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from colliding
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive # Critical for fetching the Anemone theme

      - name: Build Zola and Upload Artifact
        uses: getzola/github-pages@v2
        with:
          zola_version: '0.19.1' # Adjust to your local version if needed

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
